{{- $fullname := include "autonomous-engine.fullname" . }}

# ── GitHub Service ────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-service
  labels:
    {{- include "autonomous-engine.serviceLabels" (dict "root" . "service" "github-service") | nindent 4 }}
spec:
  replicas: {{ .Values.githubService.replicas }}
  selector:
    matchLabels:
      {{- include "autonomous-engine.serviceSelectorLabels" (dict "root" . "service" "github-service") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "autonomous-engine.serviceSelectorLabels" (dict "root" . "service" "github-service") | nindent 8 }}
    spec:
      containers:
        - name: github-service
          image: {{ include "autonomous-engine.image" (dict "root" . "service" "github-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.githubService.port }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
            - secretRef:
                name: {{ $fullname }}-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.githubService.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.githubService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.githubService.resources | nindent 12 }}
          volumeMounts:
            - name: repo-cache
              mountPath: /repo-cache
      volumes:
        - name: repo-cache
          persistentVolumeClaim:
            claimName: {{ $fullname }}-repo-cache
---
apiVersion: v1
kind: Service
metadata:
  name: github-service
  labels:
    {{- include "autonomous-engine.serviceLabels" (dict "root" . "service" "github-service") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "autonomous-engine.serviceSelectorLabels" (dict "root" . "service" "github-service") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.githubService.port }}
      targetPort: {{ .Values.githubService.port }}

