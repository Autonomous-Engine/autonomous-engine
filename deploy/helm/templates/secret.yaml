apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autonomous-engine.fullname" . }}-secrets
  labels:
    {{- include "autonomous-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseURL | default (printf "postgres://%s@postgres:%d/autonomous_engine" .Values.postgres.username (.Values.postgres.port | int)) | quote }}
  KAFKA_BROKERS: {{ .Values.secrets.kafkaBrokers | default (printf "kafka:%d" (.Values.kafka.port | int)) | quote }}
  MASTER_ENCRYPTION_KEY: {{ required "secrets.masterEncryptionKey is required (32 bytes)" .Values.secrets.masterEncryptionKey | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (at least 32 bytes)" .Values.secrets.jwtSecret | quote }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  JIRA_API_TOKEN: {{ .Values.secrets.jiraAPIToken | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openAIAPIKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicAPIKey | quote }}
  REDIS_URL: {{ include "autonomous-engine.redisURL" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "ae_password" | quote }}
