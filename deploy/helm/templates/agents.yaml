{{- $fullname := include "autonomous-engine.fullname" . }}

# ── Product Agent ─────────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-agent
  labels:
    {{- include "autonomous-engine.serviceLabels" (dict "root" . "service" "product-agent") | nindent 4 }}
spec:
  replicas: {{ .Values.productAgent.replicas }}
  selector:
    matchLabels:
      {{- include "autonomous-engine.serviceSelectorLabels" (dict "root" . "service" "product-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "autonomous-engine.serviceSelectorLabels" (dict "root" . "service" "product-agent") | nindent 8 }}
    spec:
      containers:
        - name: product-agent
          image: {{ include "autonomous-engine.image" (dict "root" . "service" "product-agent") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.productAgent.port }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
            - secretRef:
                name: {{ $fullname }}-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.productAgent.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.productAgent.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.productAgent.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: product-agent
  labels:
    {{- include "autonomous-engine.serviceLabels" (dict "root" . "service" "product-agent") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "autonomous-engine.serviceSelectorLabels" (dict "root" . "service" "product-agent") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.productAgent.port }}
      targetPort: {{ .Values.productAgent.port }}

