# ── Shared PVC for repo-cache ─────────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-repo-cache
  labels:
    {{- include "autonomous-engine.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteMany"]
  {{- if .Values.persistence.repoCache.storageClass }}
  storageClassName: {{ .Values.persistence.repoCache.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.repoCache.size }}
