      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

jiraSync:
  replicas: 1
  port: 8084
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

changeReconciler:
  replicas: 1
  port: 8085
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

knowledgeIndexer:
  replicas: 1
  port: 8087
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

onboarding:
  replicas: 1
  port: 8086
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Dashboard ─────────────────────────────────────────────────────────────────

dashboardBackend:
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

dashboardFrontend:
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Customer Portal ───────────────────────────────────────────────────────────

portal:
  replicas: 1
  port: 3100
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Ingress ───────────────────────────────────────────────────────────────────

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    gateway: gateway.autonomous-engine.local
    webhook: webhook.autonomous-engine.local
    dashboard: dashboard.autonomous-engine.local
    portal: portal.autonomous-engine.local
  tls: []

# ── Config (non-secret) ───────────────────────────────────────────────────────

config:
  researchPoolSize: "5"
  implPoolSize: "3"
  qaPoolSize: "2"
  gatewayPort: "8082"
  webhookPort: "8081"
  statusOrchestratorPort: "8089"
  dashboardPort: "8080"
  portalPort: "3100"
  logLevel: "info"
  featureFlags:
    enableHumanReview: "true"
    enableJiraSync: "true"

# ── Secrets (set at deploy time) ──────────────────────────────────────────────

secrets:
  databaseURL: ""
  kafkaBrokers: ""
  masterEncryptionKey: ""
  jwtSecret: ""
  githubToken: ""
  # Fallback for the GitHub webhook secret saved on the dashboard
  # (Admin -> Integrations). With neither set, webhook-listener refuses
  # every GitHub delivery.
  githubWebhookSecret: ""
  jiraAPIToken: ""
  openAIAPIKey: ""
  anthropicAPIKey: ""

# ── Persistence ───────────────────────────────────────────────────────────────

persistence:
  repoCache:
    size: 50Gi
    storageClass: ""
  backups:
    size: 100Gi
    storageClass: ""
