# Default values for autonomous-engine Helm chart.

# Every service runs its own image, as published by
# .github/workflows/publish-images.yml:
#   <registry>/<repositoryPrefix><service>:<tag>
#   e.g. ghcr.io/autonomous-engine/ae-gateway:v0.1.0
image:
  registry: ghcr.io
  repositoryPrefix: autonomous-engine/ae-
  # Empty = the release this chart belongs to ("v" + appVersion, e.g. v0.1.0).
  # "stable" follows the newest release; any other published tag pins one.
  tag: ""
  pullPolicy: IfNotPresent

# Global replica defaults (override per-service below)
replicaCount: 1

# ── Infrastructure ────────────────────────────────────────────────────────────

kafka:
  enabled: true
  image: apache/kafka:3.7.0
  replicas: 1
  port: 9092
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  config:
    offsetsTopicReplicationFactor: "1"
    transactionStateLogReplicationFactor: "1"
    transactionStateLogMinISR: "1"
    autoCreateTopicsEnable: "true"
    clusterId: autonomous-engine-cluster

postgres:
  enabled: true
  image: postgres:16-alpine
  replicas: 1
  port: 5432
  storage:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  database: autonomous_engine
  username: ae_user
  # password set via secret

qdrant:
  enabled: true
  image: qdrant/qdrant:latest
  replicas: 1
  port: 6333
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Optional Redis for state shared between replicas: the dashboard WebSocket
# fan-out and the portal / LLM-router rate limits. Off by default; a single
# replica of every service needs nothing from it. dashboardBackend.replicas
# above 1 requires it (the chart and the dashboard both refuse otherwise).
# Set url to use an external Redis instead of the in-chart one.
redis:
  enabled: false
  image: redis:7.4-alpine
  port: 6379
  url: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ── Core Services ─────────────────────────────────────────────────────────────

gateway:
  replicas: 1
  port: 8082
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

statusOrchestrator:
  replicas: 1
  port: 8089
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

webhookListener:
  replicas: 1
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

