    enabled: true
    minReplicas: 1
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 512Mi

# ── Integration Services ──────────────────────────────────────────────────────

githubService:
  replicas: 1
