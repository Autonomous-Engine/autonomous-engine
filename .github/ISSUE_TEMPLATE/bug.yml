name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, the request you submitted, and the work item state shown in the dashboard.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs <service>` around the failure. Remove secrets and tokens.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or a commit SHA"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: LLM provider and model
      placeholder: "ollama qwen2.5-coder:32b"
