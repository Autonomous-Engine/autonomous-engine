name: Publish Docker images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: autonomous-engine

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: docker/Dockerfile.service
          - service: status-orchestrator
            dockerfile: docker/Dockerfile.service
          - service: webhook-listener
            dockerfile: docker/Dockerfile.service
          - service: product-agent
            dockerfile: docker/Dockerfile.service
          - service: research-coordinator
            dockerfile: docker/Dockerfile.service
          - service: research-agent
            dockerfile: docker/Dockerfile.agent-lsp
          - service: implementation-planner
            dockerfile: docker/Dockerfile.service
          - service: implementation-agent
            dockerfile: docker/Dockerfile.implementation-agent
          - service: pr-coordinator
            dockerfile: docker/Dockerfile.service
          - service: review-agent
            dockerfile: docker/Dockerfile.agent-lsp
          - service: qa-agent
            dockerfile: docker/Dockerfile.qa-agent
          - service: chat-agent
            dockerfile: docker/Dockerfile.service
          - service: github-service
            dockerfile: docker/Dockerfile.service
          - service: jira-sync
            dockerfile: docker/Dockerfile.service
          - service: change-reconciler
            dockerfile: docker/Dockerfile.service
          - service: credential-monitor
            dockerfile: docker/Dockerfile.service
          - service: knowledge-indexer
            dockerfile: docker/Dockerfile.agent-lsp
          - service: onboarding
            dockerfile: docker/Dockerfile.service
          - service: dashboard-backend
            dockerfile: docker/Dockerfile.service
          - service: dashboard-frontend
            dockerfile: docker/Dockerfile.dashboard
          - service: portal
            dockerfile: docker/Dockerfile.portal
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: vars
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          [ "$GITHUB_REF" = "$VERSION" ] && VERSION="manual-$(date +%Y%m%d-%H%M)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/ae-${{ matrix.service }}:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/ae-${{ matrix.service }}:stable
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
