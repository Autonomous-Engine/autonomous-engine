name: demo-app

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: demo-app-server
    command: ["node", "dist/server/index.js"]
    restart: unless-stopped
    volumes:
      - places-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - PORT=3080
      - LOG_LEVEL=info
      - GEOCODER_ENABLED=true
      - GEOCODER_REGIONS=all
      - GEOCODER_ZOOM_MIN=8
    ports:
      - "3080:3080"
    networks:
      - internal
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: demo-app-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - internal

  import-parks:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: demo-app-import-parks
    command: ["node", "dist/import/run.js", "--category", "parks"]
    restart: unless-stopped
    volumes:
      - places-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - LOG_LEVEL=info
      - IMPORT_BATCH_SIZE=250
      - REFRESH_INTERVAL_MS=60000
    networks:
      - internal
    depends_on:
      - redis

  import-libraries:
    build:
      context: .
      dockerfile: docker/Dockerfile
