server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS at 127.0.0.11 so nginx re-resolves upstream
    # hostnames every 10 seconds instead of caching the IP at startup. This
    # is essential: rebuilding `dashboard-backend` or `onboarding` gives the
    # container a NEW IP on the docker network, and without `resolver` nginx
    # keeps trying the stale IP forever → 502 Bad Gateway until someone
    # manually `nginx -s reload`s.
    #
    # `ipv6=off` avoids an AAAA lookup that just times out on docker's DNS.
    # `valid=10s` is a tradeoff: faster re-resolve vs DNS query volume. 10s
    # is fine for a dashboard with dozens of requests per minute.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream hostnames as nginx variables. nginx only honours `resolver`
    # for proxy_pass targets that are VARIABLES — a literal hostname is
    # resolved once at config load, no matter what `resolver` says.
    set $backend "dashboard-backend:8080";
    set $onboarding "onboarding:8086";

    location /api/onboarding/ {
        proxy_pass http://$onboarding;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/onboarding {
        proxy_pass http://$onboarding;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
